# Go Admin 后端配置示例。
# 使用:cp configs/config.example.yaml configs/config.yaml 后按需修改。
# 所有选项均可被环境变量覆盖(优先级高于本文件),覆盖点见各条目的"环境变量"说明;
# 环境变量命名规则:ADMIN_<节>_<键>,全大写下划线。

server:
  # HTTP 监听地址,":8080" 表示监听所有网卡的 8080 端口。
  # 环境变量:ADMIN_SERVER_ADDR
  addr: ":8080"
  # Gin 框架运行模式,仅影响 Gin 自身的日志/调试行为,不影响业务逻辑:
  #   debug   — 本地开发:打印路由注册表与调试信息,排错信息最全
  #   release — 生产部署:关闭框架调试输出,避免泄露内部路径等信息
  #   test    — 供自动化测试使用,输出安静
  # 环境变量:ADMIN_SERVER_MODE
  mode: "release"
  # 可选:可信反向代理的 IP/CIDR 列表。未配置时不信任 X-Forwarded-For，
  # 以避免客户端伪造来源 IP。仅在 API 位于 Nginx/网关之后时填写实际代理地址。
  # 环境变量:ADMIN_SERVER_TRUSTED_PROXIES（多个值用英文逗号分隔）
  trustedProxies: []
  # 可选:CORS 允许来源。仅前端与 API 跨域直连部署(前端上 CDN/独立域名、API 在另一边)时填写,
  # 如 https://admin.example.com;同源部署(经同域 Nginx 反代)保持为空,不输出任何 CORS 头。
  # "*" 表示放行任意来源(不建议生产使用)。环境变量:ADMIN_SERVER_CORS_ALLOWED_ORIGINS
  corsAllowedOrigins: []
  # 可选:多端 SPA 静态托管。键为端名,值为该端构建产物目录:
  #   app   → 挂根路径 /(先在 web/app 执行 npm run build)
  #   admin → 挂 /admin/(先在 web/admin 执行 npm run build,产物路由基座即 /admin/)
  # 未匹配到 API 与真实文件时自动回退对应端的 index.html(SPA history 路由刷新场景)。
  # 留空或不写则由 Nginx 等外部静态服务托管(生产交付推荐形态);
  # map 字段不支持环境变量覆盖。旧版单目录字段 webDir 已移除,请改用 webDirs。
  webDirs:
    app: ""
    admin: ""

mysql:
  # 必填:MySQL 连接串,格式 user:password@tcp(host:port)/dbname?charset=utf8mb4&parseTime=True&loc=Local
  # 环境变量:ADMIN_MYSQL_DSN
  dsn: ""
  # 最大打开连接数。并发不高可保持默认 50;过高会打满 MySQL 连接上限。
  # 环境变量:ADMIN_MYSQL_MAX_OPEN_CONNS
  maxOpenConns: 50
  # 最大空闲连接数(默认 10),避免频繁重建连接。
  maxIdleConns: 10
  # 连接最大存活秒数(默认 3600),到期后连接重建,防止使用过期连接。
  connMaxLifetimeSec: 3600
  # GORM 慢查询阈值毫秒数,超过则记录慢查询警告日志。
  slowThresholdMs: 500

jwt:
  # 必填:JWT 签名密钥,长度不得少于 16 位。
  # 生产环境务必用 32 位以上随机串(如 openssl rand -base64 32 生成);
  # 泄露等于全站登录态可被伪造,更换后所有用户需重新登录。
  # 环境变量:ADMIN_JWT_SECRET
  secret: ""
  # access token 有效期(分钟),即登录后的直接访问凭据,到期由前端自动刷新。
  # 环境变量:ADMIN_JWT_ACCESS_TTL_MINUTES
  accessTTLMinutes: 60
  # refresh token 有效期(小时),用于无感续期;轮换使用,旧令牌立即吊销。
  # 环境变量:ADMIN_JWT_REFRESH_TTL_HOURS
  refreshTTLHours: 3600
  # JWT 的 iss(签发者)声明,仅作标识,一般不改。
  issuer: "go-admin"

log:
  # 结构化日志级别:debug | info | warn | error。
  # 生产建议 info;排查问题时临时调到 debug。
  # 环境变量:ADMIN_LOG_LEVEL
  level: "info"

upload:
  # 上传文件存储根目录(相对路径基于运行目录)。目录不存在会自动创建。
  # 文件按"年/月/日/随机名"存放;公开/私有访问策略见 publicURL。
  # 环境变量:ADMIN_UPLOAD_DIR
  dir: "./data/uploads"
  # 单个上传文件大小上限(MB)。超出返回参数错误。
  # 环境变量:ADMIN_UPLOAD_MAX_SIZE_MB
  maxSizeMB: 20
  # 公开文件的访问 URL 前缀(须以 / 开头)。
  # 命中 is_public=true 的文件可经 {publicURL}/{storePath} 直接下载;
  # is_public=false 的文件只能走 /admin-api/files/:id/download 鉴权接口。
  publicURL: "/files"

audit:
  # 操作日志与登录日志的保留天数,超过自动清理(每日定时执行)。
  # 0 表示永久保留;生产建议 90~180,兼顾审计与磁盘占用。
  # 环境变量:ADMIN_AUDIT_RETENTION_DAYS
  retentionDays: 90
