name: Verify

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: api/go.sum
      - run: go test ./...
      - run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Build release package
        run: bash deploy/binary/build-release.sh
      - name: Verify artifacts
        run: |
          test -x release/go-admin
          test -f release/web/app/index.html
          test -f release/web/admin/index.html
          test -f release/go-admin-release.tar.gz
