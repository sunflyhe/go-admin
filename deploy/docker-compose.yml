# 完整交付:MySQL + API + Nginx 托管的 Web 管理端。
# 使用前执行: cp deploy/.env.example deploy/.env，并替换其中全部示例密钥。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-go_admin}
      MYSQL_USER: ${MYSQL_USER:-goadmin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置 MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMIN_MYSQL_DSN: "${MYSQL_USER:-goadmin}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-go_admin}?charset=utf8mb4&parseTime=True&loc=Local"
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?请在 deploy/.env 设置 ADMIN_JWT_SECRET}
      ADMIN_SERVER_ADDR: ":8080"
      ADMIN_SERVER_MODE: "release"
      # 仅信任本 Compose 中固定的 Nginx 地址提供的 X-Forwarded-For。
      ADMIN_SERVER_TRUSTED_PROXIES: "172.30.0.10"
      ADMIN_UPLOAD_DIR: "/data/uploads"
    volumes:
      - upload_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      backend:
        ipv4_address: 172.30.0.10

volumes:
  mysql_data:
  upload_data:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
