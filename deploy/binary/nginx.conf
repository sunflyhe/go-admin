# Nginx 站点配置(路线 B):复制到 /etc/nginx/sites-available/go-admin 并软链到 sites-enabled。
# server_name 换成你的域名或服务器 IP;配好域名后用 certbot --nginx -d <域名> 自动签发 HTTPS。
server {
  listen 80;
  server_name _; # TODO: 换成你的域名,如 admin.example.com
  client_max_body_size 22m; # 与后端上传上限(maxSizeMB 20MB)匹配,留出 multipart 开销

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # app 端接口(/api,含 portal 开放接口)
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # admin 端接口(/admin-api)
  location /admin-api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 公开/私有文件下载
  location /files/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # admin 端带 hash 的静态资源:内容即版本,长缓存
  location /admin/assets/ {
    alias /opt/go-admin/web/admin/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # admin 管理端 SPA;index 必须 no-cache(expires -1),否则发版后用户停留在旧 bundle
  location /admin/ {
    alias /opt/go-admin/web/admin/;
    expires -1;
    try_files $uri $uri/ /admin/index.html;
  }

  # app 端带 hash 的静态资源
  location /assets/ {
    root /opt/go-admin/web/app;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # app 端 SPA(根路径,history 路由刷新回退 index.html)
  location / {
    root /opt/go-admin/web/app;
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
